<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>tl;dv Transcript Extractor</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      width: 380px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #111827;
      color: #f9fafb;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1f2937;
      color: #9ca3af;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #extractBtn {
      flex: 1;
      background: #4f46e5;
      color: #ffffff;
    }
    #extractBtn:hover:not(:disabled) {
      background: #4338ca;
    }
    .secondary-btn {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .secondary-btn:hover:not(:disabled) {
      background: #374151;
    }
    .options {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #d1d5db;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    #status {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      min-height: 16px;
    }
    #output {
      width: 100%;
      height: 220px;
      box-sizing: border-box;
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 10px;
    }
    .export-bar {
      display: flex;
      gap: 6px;
    }
    .export-bar button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>
    <span>tl;dv Transcript Extractor</span>
    <span id="countBadge" class="badge">0 blocks</span>
  </h1>

  <div class="options">
    <label><input type="checkbox" id="includeTimestamps" checked /> Timestamps</label>
    <label><input type="checkbox" id="mergeConsecutive" /> Merge same speaker</label>
  </div>

  <div class="controls">
    <button id="extractBtn">Extract Full Transcript</button>
  </div>

  <div id="status">Ready. Open a tl;dv meeting with transcript visible.</div>

  <textarea id="output" readonly placeholder="Extracted transcript will appear here..."></textarea>

  <div class="export-bar">
    <button id="copyBtn" class="secondary-btn" disabled>Copy Text</button>
    <button id="downloadTxtBtn" class="secondary-btn" disabled>.TXT</button>
    <button id="downloadMdBtn" class="secondary-btn" disabled>.MD</button>
    <button id="downloadJsonBtn" class="secondary-btn" disabled>.JSON</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
